# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GO: "go"

  LEFTHOOK_PKG: "github.com/evilmartians/lefthook/v2@latest"
  GOLANGCI_LINT_PKG: "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest"
  BENCHSTAT_PKG: "golang.org/x/perf/cmd/benchstat@latest"
  GOVULNCHECK_PKG: "golang.org/x/vuln/cmd/govulncheck@latest"
  STATICCHECK_PKG: "honnef.co/go/tools/cmd/staticcheck@latest"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list-all
    silent: true

  tidy:
    desc: "Sync workspace and tidy current root module"
    cmds:
      - "{{.GO}} work sync"
      - "{{.GO}} mod tidy"

  fmt:
    desc: "Format all packages"
    cmds:
      - "{{.GO}} fmt ./..."

  test:
    desc: "Run tests for all packages"
    cmds:
      - "{{.GO}} test ./..."

  test:race:
    desc: "Run race tests for all packages"
    env:
      CGO_ENABLED: 1
    cmds:
      - "{{.GO}} test -race ./..."

  lint:
    desc: "Run golangci-lint"
    cmds:
      - "{{.GO}} run {{.GOLANGCI_LINT_PKG}} run ./..."

  staticcheck:
    desc: "Run staticcheck"
    cmds:
      - "{{.GO}} run {{.STATICCHECK_PKG}} ./..."

  vuln:
    desc: "Run govulncheck"
    cmds:
      - "{{.GO}} run {{.GOVULNCHECK_PKG}} ./..."

  check:
    desc: "Run all quality checks"
    deps:
      - "fmt"
      - "test"
      - "lint"
      - "staticcheck"
      - "vuln"

  bench:
    desc: "Run benchmarks"
    cmds:
      - mkdir -p .bench
      - "{{.GO}} test -run=^$ -bench=. -benchmem ./... | tee .bench/current.txt"

  bench:cmp:
    desc: "Compare benchmark results, usage: task bench:cmp OLD=.bench/old.txt NEW=.bench/current.txt"
    requires:
      vars: ["OLD", "NEW"]
    cmds:
      - "{{.GO}} run {{.BENCHSTAT_PKG}} {{.OLD}} {{.NEW}}"

  lefthook:install:
    desc: "Install git hooks using lefthook"
    cmds:
      - "{{.GO}} run {{.LEFTHOOK_PKG}} install"

  lefthook:run:
    desc: "Run pre-commit hook using lefthook"
    cmds:
      - "{{.GO}} run {{.LEFTHOOK_PKG}} run pre-commit"

  tag:root:
    desc: "Create git tag for root module, usage: task tag:root VERSION=v1.2.3"
    requires:
      vars: ["VERSION"]
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. task tag:root VERSION=v1.2.3"
    cmds:
      - git tag {{.VERSION}}
      - git push origin {{.VERSION}}

  tag:fx:
    desc: "Create git tag for fx module, usage: task tag:fx VERSION=v0.2.0"
    requires:
      vars: ["VERSION"]
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. task tag:fx VERSION=v0.2.0"
    cmds:
      - git tag fx/{{.VERSION}}
      - git push origin fx/{{.VERSION}}

  release:root:
    desc: "Release root module, usage: task release:root VERSION=v1.2.3"
    requires:
      vars: ["VERSION"]
    deps:
      - "check"
    preconditions:
      - sh: git diff --quiet
        msg: "Working tree is dirty, please commit changes first"
      - sh: git diff --cached --quiet
        msg: "Staged changes exist, please commit them first"
    cmds:
      - task: "tag:root"
        vars:
          VERSION: "{{.VERSION}}"

  release:fx:
    desc: "Release fx module, usage: task release:fx VERSION=v0.2.0"
    requires:
      vars: ["VERSION"]
    deps:
      - "check"
    preconditions:
      - sh: git diff --quiet
        msg: "Working tree is dirty, please commit changes first"
      - sh: git diff --cached --quiet
        msg: "Staged changes exist, please commit them first"
    cmds:
      - task: "tag:fx"
        vars:
          VERSION: "{{.VERSION}}"

  release:
    desc: "Release root and fx modules together"
    requires:
      vars: ["ROOT_VERSION", "FX_VERSION"]
    deps:
      - "check"
    preconditions:
      - sh: git diff --quiet
        msg: "Working tree is dirty, please commit changes first"
      - sh: git diff --cached --quiet
        msg: "Staged changes exist, please commit them first"
    cmds:
      - task: "tag:root"
        vars:
          VERSION: "{{.ROOT_VERSION}}"
      - task: "tag:fx"
        vars:
          VERSION: "{{.FX_VERSION}}"