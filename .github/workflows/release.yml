name: Release

on:
  push:
    tags:
      - "v*"
      - "fx/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.3 or fx/v0.1.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            go.sum
            fx/go.sum
            examples/go.sum

      - name: Test root module
        run: go test ./...

      - name: Test fx module
        run: go test ./...
        working-directory: fx

      - name: Test examples module
        run: go test ./...
        working-directory: examples

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_name="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$tag_name" ]; then
            echo "No tag name was provided." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
            echo "Tag '$tag_name' does not exist in this repository." >&2
            exit 1
          fi

          release_title="$tag_name"
          if [ "${tag_name#fx/}" != "$tag_name" ]; then
            release_title="fx ${tag_name#fx/}"
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release '$tag_name' already exists; skipping."
          else
            gh release create "$tag_name" --title "$release_title" --generate-notes --verify-tag
          fi
